server {
  listen 80;
  listen [::]:80;
  server_name 66.97.38.2 tickets.mobatai.com;

  include conf.d/include/letsencrypt-acme-challenge.conf;

  return 301 https://tickets.mobatai.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 off;
  server_name 66.97.38.2 tickets.mobatai.com;

  ssl_certificate /etc/letsencrypt/live/npm-19/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-19/privkey.pem;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;

  auth_basic "Bitácora privada";
  auth_basic_user_file /data/access/tickets.htpasswd;

  access_log /data/logs/tickets_access.log proxy;
  error_log /data/logs/tickets_error.log warn;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://172.17.0.1:5003;
  }
}
